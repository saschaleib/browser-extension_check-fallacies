<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Check Fallacies Panel</title>
		<meta name="color-scheme" content="dark light">
		<link rel="stylesheet" href="panel.css" defer="defer">
		<script src="../shared.js"></script>
		<script src="panel.js" defer="defer"></script>
	</head>
	<body>
		<header>
			<p id="toolbar">
				<button id="btnCancel"><span>Cancel</span></button>
				<button id="btnOptions"><span>Options</span></button>
				<button id="btnCheck"><span>Check</span></button>
				<button id="btnShortlist"><span>Shortlist</span></button>
			</p>
			<div id="optionspanel"></div>
		</header>
		<main><!-- will be filled by script --></main>
		<footer>
			<p class="disclaimer">Responses are AI-generated and can be wrong!</p>
			<form>
				<textarea id="queryField" placeholder="Chat with the AI">Summarize this article in English</textarea>
				<button type="submit" id="querySubmitBtn" title="Send to AI"><span>Send</span></button>
			</form>
		</footer>
	</body>
